plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.launcher'
    compileSdk 33

    defaultConfig {
        applicationId 'com.jarvis.launcher'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
}
